# Port
server.port=${DEV_SERVER_PORT:8080}

# Mongo connection (uses your env first, falls back to local)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bricklink}

# CORS (open while developing; tighten later)
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging (tweak to taste)
logging.level.org.springframework.web=INFO
logging.level.com.example.brickatime=INFO