# --- Mongo ---
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bricklink}

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Actuator ---
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info

# --- BrickLink base URL (Store API) ---
bricklink.baseUrl=${BRICKLINK_BASE_URL:https://api.bricklink.com/api/store/v1}

# Optional: override inventory endpoint if needed (default is /inventories)
bricklink.inventoryEndpoint=${BRICKLINK_INVENTORY_ENDPOINT:/inventories}

# BrickLink OAuth (read from env in prod; local .env or shell exports in dev)
bricklink.consumerKey=${BRICKLINK_CONSUMER_KEY:}
bricklink.consumerSecret=${BRICKLINK_CONSUMER_SECRET:}
bricklink.token=${BRICKLINK_TOKEN:}
bricklink.tokenSecret=${BRICKLINK_TOKEN_SECRET:}

# --- Logging (quiet but useful) ---
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.example.brickatime=INFO