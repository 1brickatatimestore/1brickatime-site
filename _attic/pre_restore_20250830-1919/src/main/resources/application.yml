server:
  port: ${DEV_SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bricklink}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

bricklink:
  # These resolve directly from your .env values:
  consumerKey: ${BL_KEY}
  consumerSecret: ${BL_SECRET}
  tokenValue: ${BL_TOKEN}
  tokenSecret: ${BL_TOKEN_SECRET}
  userId: ${BL_USER_ID}
  # API base is constant:
  baseUrl: https://api.bricklink.com/api/store/v1

sync:
  # 5-minute schedule like you had
  cron: "0 */5 * * * *"
  # page size to pull from BL per call (tune as needed)
  pageSize: 200

logging:
  level:
    root: INFO
    # Turn these on when you want to see BrickLink HTTP details:
    com.example.brickatime.client: INFO
    org.springframework.web.reactive.function.client: INFO
